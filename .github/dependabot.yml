# Every action in .github/workflows is pinned to a commit SHA and every Python
# dependency is pinned to an exact version. Pinning is what stops an upgrade
# happening without anyone deciding to, which also means nothing upgrades on its
# own: this file is the other half of that bargain. Without it the pins would
# simply rot.
#
# Dependabot understands a SHA pin with a `# vX.Y.Z` comment after it and moves
# both together, so the pull request stays readable.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    # One pull request for all the actions, so CI runs once and the pins move
    # together. Majors are included on purpose: they are the point of the bump.
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    # requirements.txt is what goes into the image and requirements-dev.txt
    # pulls it in, so both are found from the repository root.
    directory: "/"
    schedule:
      interval: monthly
    # Minor and patch releases arrive together; a major version stays its own
    # pull request, because that is the one that can break the build.
    groups:
      python-minor:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: deps
