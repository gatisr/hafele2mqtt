name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every action below is pinned to a commit SHA rather than to a tag. A tag is a
# mutable pointer in somebody else's repository, so whoever can move it decides
# what runs here, and docker.yml runs with `packages: write`. The readable
# version stays in the trailing comment, and .github/dependabot.yml is what
# moves the pin and the comment together.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # No Bluetooth, no broker, no hardware: the suite is pure unit tests.
      - run: python -m pytest -q

      # The fixture is generated, so a stale checked-in copy is a real failure.
      - name: Fixture is reproducible
        run: |
          python tests/make_fixture.py
          git diff --exit-code -- tests/fixtures/sample.connect
